[project]
name = "infinite-indextts-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["indextts", "fastapi==0.116.2", "uvicorn[standard]==0.35.0"]

[tool.uv]
package = false

[tool.uv.sources]
indextts = { path = "../../third_party/IndexTTS", editable = true }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
